<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <!-- Jeddah Chamber Emblem -->
  <g transform="translate(6, 8)">
    <!-- Sail 1: Large Navy Arc -->
    <path d="M12 44C12 22 28 8 46 6c-3 12-10 24-22 32-4 3-8 5-12 6z" fill="#0D3859" />
    
    <!-- Sail 2: Medium Teal Arc -->
    <path d="M22 44c4-12 12-22 22-26-4 8-8 16-14 22-2 2-5 3-8 4z" fill="#00A3E0" />
    
    <!-- Sail 3: Small Cyan Accent -->
    <path d="M30 44c3-7 8-12 14-14-3 5-5 9-9 12-1 1-3 1-5 2z" fill="#78BE20" />
    
    <!-- Base Wave -->
    <path d="M8 46c10-2 24-2 38 0" stroke="#0D3859" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <g>
    <text x="66" y="27" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="800" font-size="16" fill="#0D3859">غـرفـة جــدة</text>
    <text x="66" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="2.5" fill="#00A3E0">JEDDAH CHAMBER</text>
  </g>
</svg>
