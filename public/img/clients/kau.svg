<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none">
  <!-- King Abdulaziz University Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield / Circle -->
    <circle cx="26" cy="26" r="25" fill="#002D62" />
    <circle cx="26" cy="26" r="23" stroke="#D4AF37" stroke-width="1.2" fill="none" />
    <circle cx="26" cy="26" r="20" stroke="#002D62" stroke-width="0.8" fill="#00224A" />
    
    <!-- Open Book (Holy Quran / Knowledge) -->
    <path d="M16 33c3-2 7-2 10 0 3-2 7-2 10 0v-10c-3-2-7-2-10 0-3-2-7-2-10 0z" fill="#FFF" />
    <path d="M26 23v10" stroke="#002D62" stroke-width="1" />

    <!-- Minaret / Knowledge Beacon -->
    <path d="M25 10h2v9h-2z" fill="#D4AF37" />
    <path d="M24 10l2-4 2 4z" fill="#D4AF37" />
    
