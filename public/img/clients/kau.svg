    <path d="M19 16c2-1 4-1 6 0m2 0c2-1 4-1 6 0" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" />
    <path d="M15 37c3.5 2 7.5 2 11 0 3.5 2 7.5 2 11 0" stroke="#D4AF37" stroke-width="1.2" fill="none" />
  </g>

  <!-- Typography -->
  <g>
    <text x="68" y="28" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="700" font-size="14" fill="#002D62">جامعة الملك عبدالعزيز</text>
    <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="1.5" fill="#5A6B82">KING ABDULAZIZ UNIVERSITY</text>
  </g>
</svg>
